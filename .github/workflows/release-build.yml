name: build-draft-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-draft-release
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7"

jobs:
  validate:
    name: 核对发行来源与版本
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      windows_asset: ${{ steps.version.outputs.windows_asset }}
      macos_asset: ${{ steps.version.outputs.macos_asset }}
      android_asset: ${{ steps.version.outputs.android_asset }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 只允许从最新 main 发起
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::发行工作流只能从 main 分支手动运行。"
            exit 1
          fi
          git fetch origin main --no-tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::当前提交不是远端 main 的最新提交。"
            exit 1
          fi

      - name: 读取并校验版本
        id: version
        run: |
          python3 tools/release/release_tool.py source-check --repo-root .
          python3 tools/release/release_tool.py metadata --repo-root . --github-output "$GITHUB_OUTPUT"

      - name: 记录发行提交
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 拒绝覆盖已有标签或发行
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::标签 $TAG 已存在，请先更新 VERSION。"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::发行 $TAG 已存在，请先更新 VERSION。"
            exit 1
          fi

  test:
    name: 完整正式验证
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/formal-validation.yml

  build:
    name: 构建 ${{ matrix.label }}
    needs: [validate, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            label: Windows x86_64
            preset: Windows Desktop
            runner: ubuntu-latest
          - platform: macos
            label: macOS universal
            preset: macOS
            runner: macos-latest
          - platform: android
            label: Android arm64
            preset: Android
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Cache Godot binary and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
            ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_VERSION }}-release-export-v1

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          if [ "$RUNNER_OS" = "Linux" ]; then
            curl --fail --retry 3 -sSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d /tmp/godot-extract
            mv "/tmp/godot-extract/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot-bin/godot
            template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          else
            curl --fail --retry 3 -sSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
            unzip -q /tmp/godot.zip -d /tmp/godot-extract
            mv /tmp/godot-extract/Godot.app ~/godot-bin/Godot.app
            xattr -dr com.apple.quarantine ~/godot-bin/Godot.app || true
            ln -s ~/godot-bin/Godot.app/Contents/MacOS/Godot ~/godot-bin/godot
            template_dir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          fi
          chmod +x ~/godot-bin/godot

          curl --fail --retry 3 -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates-extract
          mkdir -p "$template_dir"
          cp -R /tmp/templates-extract/templates/. "$template_dir/"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: 配置 Android 发布签名
        if: matrix.platform == 'android'
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEYSTORE_ALIAS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/my-ai-town-release.keystore"

          if [ -n "$ANDROID_RELEASE_KEYSTORE_B64" ]; then
            : "${ANDROID_RELEASE_KEYSTORE_PASSWORD:?已配置 Android keystore 时必须同时配置 ANDROID_RELEASE_KEYSTORE_PASSWORD}"
            : "${ANDROID_RELEASE_KEYSTORE_ALIAS:?已配置 Android keystore 时必须同时配置 ANDROID_RELEASE_KEYSTORE_ALIAS}"
            printf '%s' "$ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore_path"
            keystore_password="$ANDROID_RELEASE_KEYSTORE_PASSWORD"
            keystore_alias="$ANDROID_RELEASE_KEYSTORE_ALIAS"
          else
            echo "::warning::未配置持久 Android 发布密钥，本次使用仅适合测试/内测的临时密钥；正式连续升级前请配置 ANDROID_RELEASE_KEYSTORE_B64、ANDROID_RELEASE_KEYSTORE_PASSWORD 和 ANDROID_RELEASE_KEYSTORE_ALIAS。"
            keystore_password="$(openssl rand -hex 24)"
            keystore_alias="my-ai-town-release"
            keytool -genkeypair -noprompt \
              -keystore "$keystore_path" \
              -storepass "$keystore_password" \
              -keypass "$keystore_password" \
              -alias "$keystore_alias" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=My AI Town, OU=Release, O=mewamew, L=Shanghai, ST=Shanghai, C=CN"
          fi

          echo "::add-mask::$keystore_password"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$keystore_path"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$keystore_alias"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$keystore_password"
          } >> "$GITHUB_ENV"

      - name: 在一次性构建副本写入版本
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: python3 tools/release/release_tool.py prepare --repo-root . --commit "$RELEASE_COMMIT"

      - name: 导入项目并检查脚本错误
        run: |
          set -o pipefail
          godot --headless --path game --import 2>&1 | tee /tmp/godot-release-import.log
          if grep -qE '^ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/godot-release-import.log; then
            echo "::error::发行构建导入时出现脚本或引擎错误。"
            grep -nE '^ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/godot-release-import.log | head -20
            exit 1
          fi

      - name: 正式导出
        env:
          PLATFORM: ${{ matrix.platform }}
          PRESET: ${{ matrix.preset }}
        run: |
          set -o pipefail
          mkdir -p build/windows build/android build/raw dist
          if [ "$PLATFORM" = "windows" ]; then
            godot --headless --path game --export-release "$PRESET" \
              "$GITHUB_WORKSPACE/build/windows/my-ai-town.exe" 2>&1 | tee /tmp/godot-export.log
          elif [ "$PLATFORM" = "android" ]; then
            godot --headless --path game --export-release "$PRESET" \
              "$GITHUB_WORKSPACE/build/android/my-ai-town-android.apk" 2>&1 | tee /tmp/godot-export.log
          else
            godot --headless --path game --export-release "$PRESET" \
              "$GITHUB_WORKSPACE/build/raw/my-ai-town-macos.zip" 2>&1 | tee /tmp/godot-export.log
          fi
          if grep -qE '^ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/godot-export.log; then
            echo "::error::正式导出时出现脚本或引擎错误。"
            grep -nE '^ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/godot-export.log | head -20
            exit 1
          fi

      - name: 组装并复查玩家下载包
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.validate.outputs.version }}
          WINDOWS_ASSET: ${{ needs.validate.outputs.windows_asset }}
          MACOS_ASSET: ${{ needs.validate.outputs.macos_asset }}
          ANDROID_ASSET: ${{ needs.validate.outputs.android_asset }}
        run: |
          if [ "$PLATFORM" = "windows" ]; then
            input="$GITHUB_WORKSPACE/build/windows"
            asset="$WINDOWS_ASSET"
          elif [ "$PLATFORM" = "android" ]; then
            input="$GITHUB_WORKSPACE/build/android/my-ai-town-android.apk"
            asset="$ANDROID_ASSET"
          else
            input="$GITHUB_WORKSPACE/build/raw/my-ai-town-macos.zip"
            asset="$MACOS_ASSET"
          fi
          python3 tools/release/release_tool.py package \
            --repo-root . --platform "$PLATFORM" --input "$input" --output "dist/$asset"
          python3 tools/release/release_tool.py verify \
            --archive "dist/$asset" --platform "$PLATFORM" --version "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish-draft:
    name: 建立草稿预发行
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: 生成发行说明与校验和
        run: |
          python3 tools/release/release_tool.py checksums --directory dist --output dist/SHA256SUMS
          python3 tools/release/release_tool.py release-notes --repo-root . --output dist/RELEASE_NOTES.md

      - name: 再次确认版本未被占用
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::构建期间标签 $TAG 已被创建，停止覆盖。"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::构建期间发行 $TAG 已被创建，停止覆盖。"
            exit 1
          fi

      - name: 创建 Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          IS_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          flags=(--draft)
          if [ "$IS_PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            --target "$RELEASE_COMMIT" \
            --title "My AI Town $VERSION" \
            --notes-file dist/RELEASE_NOTES.md \
            "${flags[@]}" \
            dist/*.zip dist/SHA256SUMS
